# Camera recording defaults.  These are used by CameraController and
# CameraRecorderProcess when not overridden at construction time.
#
# Edit this file to change defaults without touching code.

# FourCC codec for video output (4-char code: "mp4v", "XVID", "MJPG", "avc1", ...)
fourcc: mp4v

# Minimum FPS floor — prevents division by zero and caps the frame interval
min_fps: 0.1

# Timeout (seconds) when joining camera grab threads during shutdown
join_timeout: 2.0

# Requested *input* format from the camera itself (distinct from `fourcc`
# above, which is the output video file codec). Two or more USB cameras
# sharing one host controller can exceed its shared bandwidth budget if
# each requests an uncompressed format (OpenCV/UVC's usual default) --
# the camera(s) after the first then open fine but never deliver a frame.
# MJPG is compressed on the camera's own USB controller and is supported
# by nearly all UVC webcams, cutting required bandwidth by roughly an
# order of magnitude. Leave blank to not request any particular format.
capture_fourcc: MJPG

# Optional requested capture resolution (pixels). Lowering this further
# reduces per-camera USB bandwidth if MJPG alone isn't enough (e.g. 3+
# cameras on one hub, or a hub power budget too small for all of them at
# once). Leave blank to keep each camera's native/default resolution.
capture_width:
capture_height:

# How long (seconds) a camera may sit open-but-frameless -- e.g. lost a
# USB bandwidth/power fight with another camera -- before it's reported
# as an error instead of retrying forever with no explanation.
stall_timeout: 5.0
